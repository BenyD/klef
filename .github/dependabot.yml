# Weekly grouped dependency updates. Security alerts and security-update PRs
# are configured in repo settings, not here.
version: 2
updates:
  # npm: one weekly PR for all minor/patch bumps; majors arrive individually.
  # Cooldown: never propose a version released less than 7 days ago, so
  # compromised releases get caught and yanked before they reach us.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      # Security updates ignore the weekly schedule and, ungrouped, arrive as
      # one PR per advisory. A week in Aug 2026 produced ~20 such PRs on
      # lensdrop, each running CI, auto-merging, and rebasing every other open
      # PR. One PR per ecosystem instead.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        # Better Auth minors can require DB columns (1.6→1.7 briefly needed
        # account.issuer). Keep them out of the auto-merged group so each bump
        # is a reviewable PR; auto-merge also skips them in the workflow.
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"
          - "auth"
    commit-message:

      prefix: chore(deps)
    open-pull-requests-limit: 10

  # GitHub Actions: one weekly PR for everything, same 7-day cooldown.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
