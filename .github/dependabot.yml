# Monthly grouped dependency updates. Security alerts and security-update PRs
# are configured in repo settings, not here.
version: 2
updates:
  # npm: one monthly PR for all minor/patch bumps; majors arrive individually.
  # Cooldown: never propose a version released less than 7 days ago, so
  # compromised releases get caught and yanked before they reach us.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Security updates ignore the monthly schedule and, ungrouped, arrive as
      # one PR per advisory. A week in Aug 2026 produced ~20 such PRs on
      # lensdrop, each running CI, auto-merging, and rebasing every other open
      # PR. One PR per ecosystem instead.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Better Auth minors can require DB columns (1.6→1.7 briefly needed
      # account.issuer), so these stay out of the auto-merged group and the
      # workflow skips them. They do have to move together: better-auth and
      # @better-auth/passkey must share a @better-fetch/fetch version or the
      # client plugin stops typechecking (#112). Groups match first-wins, so
      # this sits above minor-and-patch.
      better-auth:
        applies-to: version-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
          - "auth"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        # happy-dom 20.14.5 broke the test environment (URL is not a
        # constructor, #113) and took 20 unrelated bumps down with it. On its
        # own PR, a bad release only blocks itself.
        exclude-patterns:
          - "happy-dom"
    commit-message:

      prefix: chore(deps)
    open-pull-requests-limit: 10

  # GitHub Actions: one monthly PR for everything, same 7-day cooldown.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
