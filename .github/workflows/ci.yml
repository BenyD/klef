name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repo; never hand it a write token.
permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the CLI
        run: pnpm build:cli

      # Fails if @klefsh/core reaches outside src/shared.
      - name: Build @klefsh/core
        run: pnpm build:core
