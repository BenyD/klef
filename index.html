<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo -->
    <!-- The app shell: /app, /auth and workspace URLs, and the SPA fallback
         for unknown paths. Kept out of search; scripts/prerender.tsx swaps
         this block for each marketing page's own tags (src/web/lib/seo.ts). -->
    <title>Klef - End-to-end encrypted .env sync</title>
    <meta
      name="description"
      content="Keep .env.local and .env.production in sync on every machine, end-to-end encrypted. The CLI never prints a value, so Claude Code and Cursor can use it. Free and self-hostable."
    />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klef" />
    <meta property="og:title" content="Klef - End-to-end encrypted .env sync" />
    <meta property="og:image" content="https://klef.sh/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /seo -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />

    <!-- Set the theme before first paint to avoid a light flash (FOUC). Must
         run synchronously in <head>, ahead of the app bundle. Mirrors the
         next-themes config in main.tsx (attribute="class", storageKey="theme",
         defaultTheme="system"). Setting color-scheme also gives the browser a
         dark default canvas before CSS loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
